apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devrole
  namespace: devops
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - secrets
  verbs:
  - get
  - create
  - list
  - delete
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - create
  - list
  - delete
