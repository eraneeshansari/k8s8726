apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydepvol
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mydep
  template:
    metadata:
      labels:
        app: mydep
    spec:
      containers:
      - image: nginx:latest
        name: con1
        ports:
        - containerPort: 80
        volumeMounts:
        - name: myvol
          mountPath: /app
      volumes:
      - name: myvol
        persistentVolumeClaim:
          claimName: myclaim 
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: mydep-svc
  name: mypod-svc
spec:
  type: NodePort
  selector:
    app: mydep
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80

