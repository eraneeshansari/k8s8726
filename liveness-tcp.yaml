apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydeptcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mydep
  template:
    metadata:
      labels:
        app: mydep
    spec:
      containers:
      - name: con1
        image: nginx:latest
        ports:
        - containerPort: 80
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5 

---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: mydep-svc
  name: mypod-svc
spec:
  type: NodePort
  selector:
    app: mydep
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80

