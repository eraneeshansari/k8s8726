apiVersion: v1
kind: Pod
metadata:
  labels:
    app: mango
  name: mango
spec:
  initContainers:
  - name: icon1
    image: ubuntu:22.04
    command: ["/bin/sh"]
    args: ["-c","echo '<h1> Hello from Init Containers file..</h1>' > /app/index.html"]
    volumeMounts:
    - name: myvol
      mountPath: /app
  containers:
  - name: con1
    image: nginx:latest
    ports:
    - containerPort: 80
    volumeMounts: 
    - name: myvol
      mountPath: /usr/share/nginx/html 
  volumes:
  - name: myvol
    emptyDir: {}
