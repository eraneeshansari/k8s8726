apiVersion: v1
kind: Pod
metadata:
  labels:
    app: myapp
  name: mypod1
spec:
  containers:
  - name: con1
    image: nginx:latest
    ports:
    - containerPort: 80
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: cpu
            operator: NotIn  # affinity use In, anti-affinity use NotIn
            values:
            - ryzen
